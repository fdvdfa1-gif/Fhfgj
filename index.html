<title>Nihon Diary</title>
<style>
:root{--bg:#E7EDF2;--panel:#fff;--ink:#15202B;--mut:#5B6B7A;--indigo:#2B3A9C;--indigo-d:#1A2366;--sakura:#F7C5D1;--sakura-d:#E27C96;--matcha:#4F8F3C;--matcha-d:#3A6C2B;--matcha-l:#DDEFD4;--plum:#A61E4D;--plum-d:#7C1639;--plum-l:#F8DCE5;--seal:#E0532F;--gold:#E8B53A;--line:#C9D4DE;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;--sans:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
textarea{width:100%;font:13px/1.3 monospace;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:96px;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;background:var(--indigo);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 5px 0 var(--indigo-d);transition:transform .08s,box-shadow .08s;margin-bottom:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--indigo-d)}
.btn.alt{background:#fff;color:var(--indigo);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.alt:active{box-shadow:0 1px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #A67C14}
.btn.gold:active{box-shadow:0 1px 0 #A67C14}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn small{display:block;font-weight:500;opacity:.85;font-size:.82rem;margin-top:2px}
.pad{padding:18px 18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.01em}
.brand span{font-family:var(--serif);color:var(--seal);margin-left:6px}
.lv{background:var(--ink);color:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.rank{font-size:.85rem;color:var(--mut);font-weight:700}
.xpbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.xpbar i{display:block;height:100%;background:var(--indigo);border-radius:9px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.hero .gr{flex:1}
.hero .jp{font-family:var(--serif);font-size:2.7rem;line-height:1.05;font-weight:700}
.hero .ro{color:var(--mut);font-size:.95rem;margin-top:2px}
.ring{width:92px;height:92px;flex:none}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.9rem}
.banner{background:#FFF1D6;border:2px solid var(--gold);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:.92rem}
.banner.good{background:var(--matcha-l);border-color:var(--matcha)}
h2{font-size:1.05rem;margin:24px 0 10px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card.cur{border-color:var(--indigo);box-shadow:0 4px 0 var(--indigo)}
.card.lock{opacity:.6}
.sc{display:flex;align-items:center;gap:12px}
.u-seal{width:38px;height:38px;border-radius:5px;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:700;font-size:1.1rem;display:grid;place-items:center;flex:none;transform:rotate(-3deg)}
.u-seal.done{background:var(--matcha)}
.sc .nm{flex:1;min-width:0}
.sc .nm b{display:block;font-size:1rem}
.sc .nm span{font-size:.8rem;color:var(--mut)}
.pct{font-weight:800;font-size:1.1rem}
.ub{height:8px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden;display:flex}
.ub i{display:block;height:100%}
.ub .g{background:var(--indigo)}
.ub .l{background:var(--sakura-d)}
.next{font-size:.85rem;color:var(--mut);margin-top:8px;font-family:var(--serif)}
.mini{border:0;background:none;color:var(--indigo);font-weight:700;text-decoration:underline;padding:8px 0 0;font-size:.85rem}
.q{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q:last-child{margin-bottom:0}
.q .t{flex:1;font-size:.92rem;font-weight:600}
.q .b{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.q .b i{display:block;height:100%;background:var(--matcha)}
.q .r{font-size:.8rem;font-weight:800;color:var(--mut);white-space:nowrap}
.q.done .t{text-decoration:line-through;color:var(--mut)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;border:0;background:none;padding:12px 0 10px;font-weight:700;color:var(--mut);font-size:.9rem}
.nav button.on{color:var(--indigo);box-shadow:inset 0 3px 0 var(--indigo)}
.nav button span{display:block;font-size:1.3rem;font-family:var(--serif)}
.quiz{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:14px 16px 0;transition:background .3s}
.quiz.fever{background:linear-gradient(#FBD9E1,var(--bg) 60%)}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.x{border:0;background:none;font-size:1.8rem;line-height:1;color:var(--mut);padding:4px 8px}
.bar{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--matcha);border-radius:9px;transition:width .35s}
.bar.t i{background:var(--seal);transition:none}
.combo{font-weight:800;min-width:54px;text-align:right;color:var(--seal);white-space:nowrap}
.combo.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.35)}}
.qbody{flex:1;display:flex;flex-direction:column}
.qlabel{margin:10px 0;font-weight:700;color:var(--mut)}
.tile{position:relative;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:30px 16px 22px;text-align:center;margin-bottom:16px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--ink)}
.seal{position:absolute;top:10px;right:10px;min-width:30px;height:30px;padding:0 4px;background:var(--seal);color:#fff;border-radius:4px;font:700 16px/30px var(--serif);text-align:center;transform:rotate(4deg)}
.gl{font-weight:800;word-break:break-word;line-height:1.25}
.gl.serif{font-family:var(--serif);font-weight:700}
.rom{color:var(--mut);margin-top:8px;font-size:1rem}
.say{border:0;background:var(--indigo);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.2rem;box-shadow:0 3px 0 var(--indigo-d)}
.say.big{width:88px;height:88px;font-size:2.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px 8px;font-weight:700;font-size:1.02rem;min-height:62px;line-height:1.25}
.opt.sm{font-size:.92rem}
.opt.glyph{font-family:var(--serif);font-size:2.1rem;padding:8px}
.opt.jp{font-family:var(--serif);font-size:1.35rem}
.opt:active{transform:translateY(3px);border-bottom-width:2px}
.opt.ok{background:var(--matcha-l);border-color:var(--matcha)}
.opt.bad{background:var(--plum-l);border-color:var(--plum)}
.opt.dim{opacity:.5}
.sheet{margin:16px -16px 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:3px solid;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet.ok{background:var(--matcha-l);border-color:var(--matcha)}
.sheet.bad{background:var(--plum-l);border-color:var(--plum)}
.sh1{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;margin-bottom:6px}
.sheet.ok .sh1{color:var(--matcha-d)}
.sheet.bad .sh1{color:var(--plum-d)}
.sh2{margin-bottom:12px;font-size:.98rem}
.sh2 .jp{font-family:var(--serif);font-size:1.5rem;font-weight:700}
.sh2 em{display:block;color:var(--mut);font-style:normal;margin-top:4px;font-size:.9rem}
.sh2 em b{color:var(--ink);background:var(--sakura);border-radius:4px;padding:0 3px}
.sheet .btn{background:var(--matcha);box-shadow:0 5px 0 var(--matcha-d)}
.sheet.bad .btn{background:var(--plum);box-shadow:0 5px 0 var(--plum-d)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.dots i{flex:1;max-width:30px;height:6px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--indigo)}
.lcard{text-align:center}
.lcard .big{font-size:1.5rem;font-weight:800;margin:4px 0}
.lcard p{margin:8px 4px;font-size:1rem}
.lcard .hook{background:#fff;border-left:5px solid var(--sakura-d);border-radius:10px;padding:10px 14px;text-align:left;margin:14px 0}
.lcard .hook b{background:var(--sakura);border-radius:4px;padding:0 3px}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;padding:12px;width:100%}
.sum{text-align:center}
.sum .big{font-family:var(--serif);font-size:3rem;font-weight:700;margin:10px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.stat b{display:block;font-size:1.4rem}
.stat span{color:var(--mut);font-size:.85rem}
.badge{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;margin:4px;font-weight:700;font-size:.9rem}
.badge.off{background:#fff;color:var(--mut);border:2px dashed var(--line)}
.lvup{background:var(--seal);color:#fff;border-radius:14px;padding:12px;font-weight:800;margin:10px 0;animation:pop .5s}
.chart{display:flex;align-items:flex-end;gap:4px;height:80px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.chart i{flex:1;background:var(--indigo);border-radius:3px 3px 0 0;min-height:3px}
.chart i.z{background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;gap:10px}
.row b{font-weight:700}
.seg{display:flex;gap:6px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
.seg button.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.tog{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;min-width:64px}
.tog.on{background:var(--matcha);border-color:var(--matcha);color:#fff}
.dng{color:var(--plum);border-color:var(--plum)}
.credit{font-size:.78rem;color:var(--mut);line-height:1.5;margin-top:20px}
.chest{font-size:3.4rem;border:0;background:none;animation:wob 1.2s infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:6px 0 14px}
.cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;background:#dbe3ea;color:#a9b5c1;font:1.25rem var(--serif)}
.cell.g{background:var(--matcha-l);color:var(--matcha-d)}
.cell.m{background:var(--gold);color:var(--ink)}
.alb.gr{display:flex;flex-wrap:wrap}
.alb.gr .cell{aspect-ratio:auto;padding:6px 10px;font-size:.95rem}
</style>

const KX={'シ':'Hiragana twin: し. Dots sit side by side, stroke sweeps up. Not ツ.','ツ':'Hiragana twin: つ. Dots point straight down like rain. Not シ.','ソ':'Hiragana twin: そ. Short stroke on top, long stroke falls down. Not ン.','ン':'Hiragana twin: ん. Dot sits low, stroke rises up. Not ソ.'};
function hira(chars){return [...chars].map(c=>{let r,h;if(HM[c]){r=HM[c].r;h=HM[c].h;}else{const p=DK[c].split(':');r=p[0];h=p[1]+' plus two little dashes = '+r+'.';}return add({id:'h:'+c,kind:'h',c:c,r:r,h:h});});}
function kata(chars){return [...chars].map(c=>{const hc=HL[KL.indexOf(c)];return add({id:'k:'+c,kind:'k',c:c,r:HM[hc].r,h:KX[c]||('Hiragana twin: '+hc+'. Same sound, sharper lines.')});});}
function words(txt){return txt.trim().split('\n').map(l=>{const p=l.split('|');return add({id:'w:'+p[0],kind:'w',c:p[0],r:p[1],en:p[2],kj:p[3]||'',h:p[4]||''});});}
function sents(txt){return txt.trim().split('\n').map(l=>{const p=l.split('|');return add({id:'s:'+p[0],kind:'s',c:p[0],r:p[1],en:p[2],h:p[3]||''});});}
function kanji0(lines){return lines.map(l=>{const p=l.split('|');return add({id:'j:'+p[0],kind:'j',c:p[0],en:p[1],r:p[2],h:p[3]});});}

function curStreak(){const g=gap();if(g<=1)return S.streak.n;if(g===2&&S.freeze>0)return S.streak.n;return 0;}
function touchStreak(){const g=gap();if(g===0)return;if(g===1)S.streak.n++;else if(g===2&&S.freeze>0){S.freeze--;S.streak.n++;}else S.streak.n=1;S.streak.last=tkey();S.best=Math.max(S.best,S.streak.n);}

/* ---- daily quests ---- */
const QDEF=[
 {id:'ans',t:'Answer 40 questions',need:40,r:5},
 {id:'cmb',t:'Reach a 12-answer combo',need:12,r:7},
 {id:'new',t:'Learn 8 new items',need:8,r:7},
 {id:'prf',t:'Finish a session at 95%+',need:1,r:8},
 {id:'blz',t:'Score 20+ in a Blitz round',need:1,r:7},
 {id:'ses',t:'Finish 3 sessions',need:3,r:5}];
function ensureQuests(){
  const t=tkey();if(S.quests&&S.quests.date===t)return;
  let x=0;for(const ch of t)x=(x*31+ch.charCodeAt(0))>>>0;
  const pool=QDEF.slice(),pick=[];
  while(pick.length<3){const i=x%pool.length;pick.push(pool.splice(i,1)[0]);x=Math.floor(x/7)+13*pick.length+1;}
  S.quests={date:t,list:pick.map(q=>({id:q.id,have:0,done:false})),chest:false};
}
function qprog(id,n,mode){if(Sx&&Sx.review)return;
  ensureQuests();
  S.quests.list.forEach(function(q){
    if(q.id!==id||q.done)return;
    q.have=mode==='max'?Math.max(q.have,n):q.have+n;
    const d=QDEF.find(z=>z.id===id);
    if(q.have>=d.need){q.done=true;S.coins+=d.r;if(Sx)Sx.quest.push(d.t+' (+'+d.r+' 🪙)');}
  });
}

function beep(f,d,type,v,when){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}
function sfx(k){if(k==='ok'){beep(660,.12);beep(880,.2,'sine',.08,.08);}else if(k==='bad'){beep(190,.28,'triangle',.1);}else if(k==='win'){[523,659,784,1046].forEach((f,i)=>beep(f,.2,'sine',.08,i*.1));}else if(k==='fever'){[784,988,1175,1568].forEach((f,i)=>beep(f,.12,'square',.04,i*.06));}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function confetti(){

  document.body.appendChild(c);setTimeout(function(){c.remove();},2800);}catch(e){}

/* ================= SCHEDULER (FSRS-style: stability + difficulty) ================= */
function grade(c,ok,ms){
  const now=Date.now();
  if(c.step<2){
    if(ok){c.step++;if(c.step>=2){c.st=ms<3500?2:1;c.due=now+c.st*DAY;c.reps++;}else c.due=now;}
    else{c.step=0;c.lapses++;c.d=Math.min(10,c.d+.4);c.due=now;}
  }else{
    if(ok){c.st=Math.max(1,c.st*(1.3+(10-c.d)*.11))*(ms<3000?1.2:1);c.d=Math.max(1,c.d-.15);c.reps++;}
    else{c.lapses++;c.d=Math.min(10,c.d+.6);c.st=Math.max(.5,c.st*.35);}
    c.due=now+c.st*DAY;
  }
}
function plan(){
  const now=Date.now(),ids=Object.keys(S.cards),cap=S.settings.revCap;
  const learning=ids.filter(i=>S.cards[i].step<2);
  const due=ids.filter(i=>S.cards[i].step>=2&&S.cards[i].due<=now).sort((a,b)=>S.cards[a].due-S.cards[b].due);
  const back=learning.length+due.length;
  let n=S.settings.perSession;if(back>cap*2)n=0;else if(back>cap)n=Math.min(n,3);
  const fresh=[];for(let i=0;i<ORDER.length&&fresh.length<n;i++)if(!S.cards[ORDER[i]])fresh.push(ORDER[i]);
  return{rev:learning.concat(due).slice(0,cap),fresh:fresh,back:back};
}

/* ================= QUESTIONS ================= */
function pickType(it,noAudio){
  const c=S.cards[it.id],exp=c&&(c.step>=1||c.reps>0),L=!noAudio&&canHear(it)&&S.settings.speak;let t;
  if(it.kind==='h'||it.kind==='k'){t=['glyph2ro'];if(exp){t.push('ro2glyph','ro2glyph');if(L)t.push('audio2glyph');}}
  else if(it.kind==='j'){t=['glyph2en'];if(exp){t.push('en2glyph');if(it.pr)t.push('glyph2rd');}}
  else if(it.kind==='w'){t=['jp2en'];if(exp){t.push('en2jp');if(L)t.push('audio2en');if(it.kj&&c.st>=2)t.push('kj2en');}}
  else if(it.kind==='v'){t=['jp2en'];if(exp){t.push('en2jp');if(it.c!==it.r)t.push('jp2rd','jp2rd');if(L)t.push('audio2en');if(it.ex&&!noAudio&&c.step>=2)t.push('cz2jp','cz2jp');}}
  else if(it.kind==='g'){t=['pat2en'];if(exp)t.push('cz2sf','cz2sf');}
  else{t=['jp2en'];if(exp){t.push('en2jp');if(L)t.push('audio2en');}}
  return rnd(t);
}
const LAB={ro:x=>x.r,glyph:x=>x.c,jp:x=>x.c,en:x=>x.en,kj:x=>x.kj,sf:x=>x.sf,pat:x=>x.c,rd:x=>x.kind==='v'?x.r:x.pr};
function mk(it,type){
  const sp=type.split('2'),from=sp[0],to=sp[1],lab=LAB[to];
  const correct=lab(it);
  const pool=shuffle(ITEMS.filter(x=>x.kind===it.kind&&x.id!==it.id&&lab(x)&&(from!=='cz'||it.kind!=='v'||it.ex.indexOf(x.c)<0)));
  const sc=s=>/[\u4e00-\u9fff]/.test(s)?1:/^[\u30a0-\u30ff\u30fc]+$/.test(s)?2:3;
  const score=from==='cz'?(x=>(sc(x.c)===sc(it.c)?0:3)+(Math.abs([...x.c].length-[...it.c].length)<=1?0:1)+(S.cards[x.id]?0:1)):(x=>(S.cards[x.id]?0:2)+(x.stage===it.stage?0:1));
  pool.sort((a,b)=>score(a)-score(b));
  const n=it.kind==='s'?3:4,used=new Set([correct]),picks=[];
  for(const x of pool){const l=lab(x);if(used.has(l))continue;used.add(l);picks.push({t:l,ok:false});if(picks.length>=n-1)break;}
  return{id:it.id,type:type,from:from,to:to,opts:shuffle([{t:correct,ok:true}].concat(picks))};
}

/* ================= SESSION FLOW ================= */
function ensure(id){if(!S.cards[id])S.cards[id]=newCard();}
function clearTimers(){if(Sx){clearTimeout(Sx.timer);if(Sx.tick){clearInterval(Sx.tick);Sx.tick=null;}}}
function startSession(){
  const p=plan();
  Sx={mode:'std',queue:[],uniq:new Set(),cleared:new Set(),tries:{},combo:0,best:0,xp:0,right:0,wrong:0,fresh:p.fresh.slice(),lessons:p.fresh.slice(),li:0,lv0:level(),answered:false,q:null,badges:[],quest:[],timer:null,chest:null,fever:false};
  p.fresh.forEach(id=>Sx.queue.push({id:id}));
  shuffle(p.rev).forEach(id=>Sx.queue.push({id:id}));
  if(!Sx.queue.length)shuffle(Object.keys(S.cards)).slice(0,10).forEach(id=>Sx.queue.push({id:id,relearn:true}));
  if(!Sx.queue.length){Sx=null;return;}
  Sx.queue.forEach(e=>Sx.uniq.add(e.id));
  S.lastIds=Array.from(Sx.uniq);S.lastFresh=p.fresh.slice();
  if(Sx.lessons.length){view='lesson';ensure(Sx.lessons[0]);render();if(S.settings.speak&&BYID[Sx.lessons[0]].kind!=='g')speakIt(BYID[Sx.lessons[0]]);}
  else beginQuiz();
}
function lessonNext(){
  Sx.li++;
  if(Sx.li>=Sx.lessons.length)return beginQuiz();
  const id=Sx.lessons[Sx.li];ensure(id);render();if(S.settings.speak&&BYID[id].kind!=='g')speakIt(BYID[id]);
}
function beginQuiz(){Sx.lessons.forEach(ensure);Store.save();view='quiz';next();}
function next(){
  if(!Sx)return;clearTimeout(Sx.timer);
  if(!Sx.queue.length)return finish();
  const ent=Sx.queue.shift(),it=BYID[ent.id];ensure(it.id);
  const q=mk(it,pickType(it));q.ent=ent;q.t0=Date.now();
  Sx.q=q;Sx.answered=false;view='quiz';render();
  if(q.from==='audio')speakIt(it);
}
function pick(i){
  if(!Sx||Sx.answered||!Sx.q)return;
  if(Sx.mode==='blitz')return pickBlitz(i);
  const q=Sx.q;Sx.answered=true;q.chosen=i;
  const ok=!!q.opts[i].ok,ms=Date.now()-q.t0,it=BYID[q.id],c=S.cards[it.id],ent=q.ent;
  S.answers++;if(ok)S.correct++;
  let gain=0;
  qprog('ans',1,'add');
  if(ok){
    Sx.combo++;Sx.best=Math.max(Sx.best,Sx.combo);S.bestCombo=Math.max(S.bestCombo||0,Sx.combo);
    const feverNow=Sx.combo>=10;
    gain=(10+Math.min(Sx.combo,10))*(feverNow?2:1);q.lucky=Math.random()<.12;if(q.lucky)gain+=15;
    q.fever=feverNow;
    if(Sx.combo===10)sfx('fever');else sfx('ok');
    vib(12);if(!Sx.review&&Sx.combo%5===0)S.coins++;Sx.right++;
    qprog('cmb',Sx.combo,'max');
  }else{Sx.combo=0;Sx.wrong++;sfx('bad');vib([30,40,30]);}
  if(Sx.review)gain=0;q.gain=gain;
  if(!ent.relearn)grade(c,ok,ms);
  Sx.tries[it.id]=(Sx.tries[it.id]||0)+1;
  if(!ok&&Sx.tries[it.id]<4)Sx.queue.splice(Math.min(3,Sx.queue.length),0,{id:it.id,relearn:c.step>=2});
  else if(ok&&c.step<2&&!ent.relearn&&Sx.tries[it.id]<4)Sx.queue.splice(Math.min(5,Sx.queue.length),0,{id:it.id});
  else Sx.cleared.add(it.id);
  if(gain&&!Sx.review){addXP(gain);if(goalCheck())q.goal=true;}
  Store.save();
  render();
  if(S.settings.speak&&it.kind!=='s'&&it.kind!=='g')speakIt(it);
  if(ok){const tq=q;Sx.timer=setTimeout(function(){if(Sx&&Sx.q===tq)next();},1100);}
}
function finish(){
  if(Sx.review){Store.save();view='summary';render();sfx('win');vib([20,30,20]);return;}
  addXP(20);S.coins+=3;S.sessions++;
  const n=Sx.right+Sx.wrong,acc=n?Sx.right/n:0;
  qprog('new',Sx.fresh.length,'add');qprog('ses',1,'add');
  if(n>=8&&acc>=.95)qprog('prf',1,'add');
  if(n>=8&&acc===1){addXP(30);Sx.flawless=true;}
  goalCheck();mileCheck();lvBonus();Sx.badges=checkBadges();
  Store.save();view='summary';render();sfx('win');vib([20,30,20,30,60]);confetti();
}

/* ---- Blitz: 60 seconds, rapid fire, no effect on scheduling ---- */
function startBlitz(){
  const pool=Object.keys(S.cards).filter(id=>BYID[id].kind!=='s');
  if(pool.length<10)return;
  Sx={mode:'blitz',pool:pool,endAt:Date.now()+60000,score:0,right:0,wrong:0,combo:0,best:0,answered:false,q:null,xp:0,fresh:[],lessons:[],badges:[],quest:[],lv0:level(),last:'',timer:null,tick:null};
  view='quiz';nextBlitz();
  Sx.tick=setInterval(blitzTick,200);
}
function blitzTick(){
  if(!Sx||Sx.mode!=='blitz')return;
  const left=Math.max(0,Sx.endAt-Date.now()),b=document.getElementById('tbar'),t=document.getElementById('tleft');
  if(b)b.style.width=(left/600)+'%';if(t)t.textContent=Math.ceil(left/1000)+'s';
  if(left<=0)finishBlitz();
}
function nextBlitz(){
  clearTimeout(Sx.timer);let id;
  for(let i=0;i<6;i++){id=rnd(Sx.pool);if(id!==Sx.last)break;}
  Sx.last=id;const it=BYID[id];
  const q=mk(it,pickType(it,true));q.ent={id:id};q.t0=Date.now();

}
function pickBlitz(i){
  const q=Sx.q;Sx.answered=true;q.chosen=i;const ok=!!q.opts[i].ok;
  S.answers++;if(ok)S.correct++;
  if(ok){Sx.combo++;Sx.best=Math.max(Sx.best,Sx.combo);Sx.score+=1+Math.floor(Sx.combo/5);Sx.right++;sfx('ok');vib(8);}
  else{Sx.combo=0;Sx.wrong++;sfx('bad');}
  render();
  Sx.timer=setTimeout(function(){if(Sx&&Sx.mode==='blitz'&&Date.now()<Sx.endAt)nextBlitz();},ok?350:850);
}
function finishBlitz(){
  if(!Sx||Sx.mode!=='blitz'||Sx.done)return;Sx.done=true;clearTimers();
  const sc=Sx.score;addXP(sc*3);Sx.coinsEarned=Math.floor(sc/6);S.coins+=Sx.coinsEarned;
  Sx.newHi=sc>(S.hiBlitz||0);if(Sx.newHi)S.hiBlitz=sc;S.blitzes=(S.blitzes||0)+1;
  if(sc>=20)qprog('blz',1,'add');goalCheck();mileCheck();lvBonus();Sx.badges=checkBadges();
  Store.save();view='summary';render();sfx('win');if(Sx.newHi)confetti();
}

/* ---- Speaking practice: say the word, the phone's speech recognizer checks it ---- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let Sp=null,SPREC=null,REVMAP=null;
const toHira=t=>String(t).replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const DIG={'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','10':'十'};
function normSp(t){
  t=String(t).normalize('NFKC').toLowerCase();
  if(DIG[t])t=DIG[t];
  return toHira(t).replace(/[\s、。，．,.!?！？「」『』~〜～・]/g,'');
}
function cleanRd(r){return normSp(String(r).replace(/\(.*?\)|（.*?）/g,''));}
function spkReads(it){
  const rs=String(it.r||'').split(/[;、]/).map(cleanRd).filter(x=>/^[\u3041-\u3096ー]+$/.test(x));
  if(!rs.length){const f=normSp(fbText(it));if(/^[\u3041-\u3096ー]+$/.test(f))rs.push(f);}
  return rs;
}
function buildRevMap(){
  REVMAP={};
  ITEMS.forEach(function(x){
    if(x.kind!=='v'&&x.kind!=='w')return;
    spkReads(x).forEach(function(rd){
      const set=REVMAP[rd]||(REVMAP[rd]=new Set());
      String(x.c).split(/[;、]/).forEach(f=>{f=normSp(f.replace(/\(.*?\)/g,''));if(f)set.add(f);});
      if(x.kj)set.add(normSp(x.kj));
    });
  });
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=[];for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];
}
function spkJudge(it,alts){
  if(!REVMAP)buildRevMap();
  const reads=spkReads(it);
  const ok=new Set(reads);
  reads.forEach(rd=>{(REVMAP[rd]||[]).forEach(f=>ok.add(f));});
  String(it.c).split(/[;、]/).forEach(f=>{f=normSp(f.replace(/\(.*?\)/g,''));if(f)ok.add(f);});
  if(it.kj)ok.add(normSp(it.kj));
  let best='miss';
  for(const a of alts){
    const n=normSp(a);if(!n)continue;
    if(ok.has(n))return 'ok';
    if(/^[\u3041-\u3096ー]+$/.test(n)){
      reads.forEach(function(rd){const r=1-lev(n,rd)/Math.max(n.length,rd.length);if(r>=.7)best='close';});
    }
  }
  return best;
}
function spkPool(){
  return Object.keys(S.cards).filter(function(id){const it=BYID[id];return it&&(it.kind==='v'||it.kind==='w')&&spkReads(it).some(r=>r.length>=2);});
}
function startSpeak(){
  clearTimers();stopAudio();Sx=null;
  if(!SRC){flash='Speaking practice needs speech recognition. Open this app in Chrome (Android or desktop).';view='review';render();return;}
  const pool=spkPool();
  if(!pool.length){flash='Learn a few words first, then come back to practise speaking.';view='review';render();return;}
  const n=Math.min(S.settings.revN>=40?15:10,pool.length);
  Sp={ids:shuffle(pool.slice()).slice(0,n),i:0,tries:0,heard:'',res:null,msg:'',listening:false,results:[],missed:[]};
  view='speak';render();
}
function spkAbort(){try{if(SPREC){SPREC.onresult=SPREC.onerror=SPREC.onend=null;SPREC.abort();}}catch(e){}SPREC=null;if(Sp)Sp.listening=false;}
function spkListen(){
  if(!Sp||Sp.listening||!SRC)return;
  stopAudio();spkAbort();
  const it=BYID[Sp.ids[Sp.i]];
  const r=new SRC();SPREC=r;r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  Sp.listening=true;Sp.msg='';Sp.res=null;Sp.heard='';
  r.onresult=function(ev){
    const alts=[];
    try{const res=ev.results[ev.results.length-1];for(let k=0;k<res.length;k++)alts.push(res[k].transcript);}catch(e){}
    if(!Sp)return;
    Sp.heard=alts[0]||'';Sp.tries++;Sp.res=alts.length?spkJudge(it,alts):'miss';
    if(Sp.res==='ok'){sfx('ok');vib(12);}else sfx('bad');
  };
  r.onerror=function(ev){
    if(!Sp)return;
    const e=ev&&ev.error;
    Sp.msg=e==='not-allowed'||e==='service-not-allowed'?'Microphone is blocked. Allow the microphone for this site in Chrome settings, then try again.'
      :e==='no-speech'?'I did not hear anything. Tap the mic and speak right after it turns red.'
      :e==='network'?'Speech recognition needs an internet connection.'
      :e==='audio-capture'?'No microphone found.':'Could not listen ('+(e||'error')+'). Try again.';
    Sp.listening=false;render();
  };
  r.onend=function(){if(Sp){Sp.listening=false;render();}};
  try{r.start();}catch(e){Sp.listening=false;Sp.msg='Could not start the microphone.';}
  render();
}
function spkNext(){
  if(!Sp)return;
  const id=Sp.ids[Sp.i],good=Sp.res==='ok';
  Sp.results.push(good?(Sp.tries<=1?'first':'later'):'miss');
  if(!good)Sp.missed.push(id);
  spkAbort();
  Sp.i++;Sp.tries=0;Sp.heard='';Sp.res=null;Sp.msg='';
  if(Sp.i>=Sp.ids.length)Sp.done=true;
  render();
}
function speakV(){
  if(Sp.done)return speakSumV();
  const it=BYID[Sp.ids[Sp.i]],reads=spkReads(it);
  const dots='<div class="dots">'+Sp.ids.map((_,i)=>'<i class="'+(i<=Sp.i?'on':'')+'"></i>').join('')+'</div>';
  let res='';
  if(Sp.msg)res='<div class="banner">'+esc(Sp.msg)+'</div>';
  else if(Sp.res==='ok')res='<div class="banner good">✅ Match! I heard: '+esc(Sp.heard)+'</div>';
  else if(Sp.res==='close')res='<div class="banner">🟡 Close. I heard: '+esc(Sp.heard)+'. Listen to the model, then try again.</div>';
  else if(Sp.res==='miss')res='<div class="banner">❌ I heard: '+esc(Sp.heard||'nothing clear')+'. Listen to the model, then try again.</div>';
  const fin=Sp.res==='ok'||Sp.tries>=3;
  const reveal=fin&&Sp.res!=='ok'?'<div class="banner">The reading is <b>'+esc(reads[0]||it.r)+'</b>. Moving on is fine, you can practise it in Review later.</div>':'';
  const mic=Sp.listening?'<button class="btn gold" disabled>🔴 Listening… speak now</button>'
    :'<button class="btn gold" data-act="spkgo">🎤 '+(Sp.tries?'Try again':'Tap and say it')+'<small>Say the word clearly, in a quiet place</small></button>';
  return '<div class="pad"><div class="top"><button class="x" data-act="quit" aria-label="Quit">×</button><div style="font-weight:700;color:var(--mut)">Speaking · '+(Sp.i+1)+'/'+Sp.ids.length+'</div><span></span></div>'+dots+
   '<div style="text-align:center;margin:10px 0 16px"><div class="gl serif" style="font-size:'+(gsize(it.c)>60?60:gsize(it.c))+'px">'+esc(String(it.c).split(/[;、]/)[0])+'</div>'+
   '<div class="rom" style="font-size:1.25rem;font-family:var(--serif)">'+esc(it.r)+'</div><div class="rom">'+esc(it.en)+'</div>'+
   '<div style="margin-top:12px"><button class="say" data-act="say" data-id="'+esc(it.id)+'" aria-label="Play model">🔊</button></div></div>'+
   res+reveal+(fin?'':mic)+
   (fin?'<button class="btn" data-act="spknext">'+(Sp.i+1>=Sp.ids.length?'Finish':'Next word')+'</button>':'<button class="mini" data-act="spknext" style="display:block;margin:6px auto">Skip this word</button>')+'</div>';
}
function speakSumV(){
  const n=Sp.ids.length,first=Sp.results.filter(x=>x==='first').length,later=Sp.results.filter(x=>x==='later').length;
  const miss=Sp.missed.map(function(id){const it=BYID[id];return '<div class="q"><div class="t"><span class="jp" style="font-family:var(--serif);font-size:1.15rem">'+esc(String(it.c).split(/[;、]/)[0])+'</span> · '+esc(spkReads(it)[0]||it.r)+'<div style="color:var(--mut);font-size:.85rem">'+esc(it.en)+'</div></div><button class="say" data-act="say" data-id="'+esc(it.id)+'" aria-label="Play">🔊</button></div>';}).join('');
  return '<div class="pad sum"><div class="big">'+(first+later)+' / '+n+'</div><div style="color:var(--mut)">words matched by the speech recognizer</div>'+
   '<div class="grid"><div class="stat"><b>'+first+'</b><span>first try</span></div><div class="stat"><b>'+later+'</b><span>after retry</span></div><div class="stat"><b>'+Sp.missed.length+'</b><span>to practise</span></div><div class="stat"><b>'+n+'</b><span>words</span></div></div>'+
   (miss?'<h2>Practise these</h2><div class="card">'+miss+'</div>':'')+
   '<div class="credit" style="margin:12px 0">This checks that the recognizer understood you. It is not a pitch-accent test, and it can be forgiving.</div>'+
   '<button class="btn" data-act="spkstart">New speaking round</button><button class="btn alt" data-act="review">Back to review</button><button class="btn alt" data-act="home">Back home</button></div>';
}

/* ================= EVENTS ================= */
let resetArm=false;
function goHome(){clearTimers();spkAbort();Sp=null;Sx=null;stopAudio();view='home';render();}
$app.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'start':clearTimers();startSession();break;
    case 'blitz':clearTimers();startBlitz();break;
    case 'review':clearTimers();spkAbort();Sp=null;Sx=null;view='review';render();break;
    case 'rv':startReview(d.m,d.s);break;
    case 'spkstart':startSpeak();break;
    case 'spkgo':spkListen();break;
    case 'spknext':spkNext();break;
    case 'home':goHome();break;
    case 'quit':goHome();break;
    case 'tab':view=d.v;render();break;
    case 'got':lessonNext();break;
    case 'skipl':beginQuiz();break;
    case 'pick':pick(+d.i);break;
    case 'next':next();break;
    case 'say':speakIt(BYID[d.id]);break;
    case 'dlaudio':dlAudio();break;
    case 'tog':S.settings[d.k]=!S.settings[d.k];Store.save();render();break;
    case 'set':S.settings[d.k]=+d.v;Store.save();render();break;
    case 'chest':if(Sx&&!Sx.chest){const fr=Math.random()<.04&&S.freeze<3;Sx.chest={coins:ri(1,8),freeze:fr};S.coins+=Sx.chest.coins;if(fr)S.freeze++;Store.save();sfx('win');render();}break;
    case 'dchest':if(S.quests.list.every(q=>q.done)&&!S.quests.chest){const fr=Math.random()<.1&&S.freeze<3,c=ri(15,35);S.quests.chest=true;S.coins+=c;if(fr)S.freeze++;flash='Daily chest: +'+c+' coins'+(fr?' and a streak freeze!':'');Store.save();sfx('win');confetti();render();}break;
    case 'buyfreeze':if(S.coins>=250&&S.freeze<3){S.coins-=250;S.freeze++;flash='Streak freeze bought. It protects one missed day.';Store.save();render();}break;
    case 'skip':{const si=+d.s;if(skipArm!==si){skipArm=si;render();setTimeout(function(){if(skipArm===si){skipArm=-1;if(view==='home')render();}},3500);}else{skipArm=-1;STAGE_IDS[si].forEach(function(id){if(!S.cards[id]){const c=newCard();c.step=2;c.st=3+Math.random()*6;c.reps=1;c.due=Date.now()+Math.random()*10*DAY;S.cards[id]=c;}});flash=STAGES[si].name+' marked as known. Your reviews will spread over the next days.';Store.save();render();}break;}
    case 'backup':view='backup';render();break;
    case 'copy':{const t=document.getElementById('exp');t.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}try{if(navigator.clipboard)navigator.clipboard.writeText(t.value);ok=true;}catch(x){}document.getElementById('bmsg').textContent=ok?'Copied.':'Select the text and copy it manually.';break;}
    case 'restore':{const v=document.getElementById('imp').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||typeof o.cards!=='object')throw 0;const def=DEF();S=Object.assign(def,o);S.settings=Object.assign(def.settings,o.settings||{});Store.save();flash='Progress restored.';view='home';render();}catch(x){document.getElementById('bmsg').textContent='That code did not work. Check you copied all of it.';}break;}
    case 'reset':if(!resetArm){resetArm=true;el.textContent='Tap again';setTimeout(function(){resetArm=false;if(view==='me')render();},3500);}else{resetArm=false;const s=S.settings;S=DEF();S.settings=s;Store.save();view='home';render();}break;
  }
});

(function init(){
  try{localStorage.removeItem('nd:state:v2');}catch(e){}
  const s=Store.load();
  if(s){const def=DEF();S=Object.assign(def,s);S.settings=Object.assign(def.settings,s.settings||{});}
  ensureQuests();
  render();
  try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js');}catch(e){}
})();
})();
</script>
